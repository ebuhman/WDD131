<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Review</title>
    <meta name="description"
        content="Discover and review delicious recipes, including this simple apple crisp dessert.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Review">
    <meta property="og:description" content="Discover and review delicious recipes.">
    <meta property="og:url" content="https://example.com">
    <meta property="og:image" content="https://example.com/social-preview-image.png">

    <!-- X/Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Review">
    <meta name="twitter:description" content="Discover and review delicious recipes.">
    <meta name="twitter:image" content="https://example.com/social-preview-image.png">

    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img id="recipe-book" src="assets/recipe-book.png" alt="Recipe book logo">

        <h1>Recipe Review</h1>

        <form class="search" role="search" aria-label="Search recipes">
            <label for="searchbar" class="visually-hidden">
                Search for a recipe
            </label>

            <input id="searchbar" name="searchbar" type="search" placeholder="Find a recipe">

            <button type="submit" aria-label="Search">
                <img src="assets/search.png" alt="">
            </button>
        </form>
    </header>

    <main>
        <article class="recipe" aria-labelledby="recipe-title">
            <img src="assets/apple-crisp.jpg" alt="Apple crisp topped with vanilla ice cream">

            <div class="metadata">
                <span class="category">Dessert</span>

                <h2 id="recipe-title">Apple Crisp</h2>

                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">⭐</span>
                    <span aria-hidden="true">☆</span>
                </span>

                <p id="description">
                    This apple crisp recipe is a simple but delicious fall
                    dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </article>
    </main>

    <footer>
        <div class="social">
            <a href="#" aria-label="Instagram">
                <img src="assets/insta.png" alt="">
            </a>

            <a href="#" aria-label="YouTube">
                <img src="assets/youtube.png" alt="">
            </a>

            <a href="#" aria-label="Pinterest">
                <img src="assets/pinterest.png" alt="">
            </a>
        </div>

        <a href="https://www.flaticon.com/free-icons/recipe">
            Recipe icons created by Freepik - Flaticon
        </a>
    </footer>
</body>

</html>
