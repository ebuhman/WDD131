<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Interactive game where you can attack a character and level up">
    <meta property="og:url" content="https://ebuhman.github.io/WDD131/charactercard">
    <meta property="og:image" content="https://ebuhman.github.io/WDD131/charactercard/snortleblat.webp">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="Interactive game where you can attack a character and level up">
    <meta name="twitter:image" content="https://ebuhman.github.io/WDD131/charactercard/snortleblat.webp">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

    <link rel="stylesheet" href="styles.css">
    <script src="character.js" defer></script>
    <title>Character Card</title>
</head>

<body>
<div class="card">
    <img src="snortleblat.webp" aria-label="character" class="image">
    <h2 class="name"></h2>
    <div class="stats">
        <p id="class"></p>
        <p id="level"></p>
        <p id="health"></p>
    </div>
    <button class="buttons" type="button" id="attacked">Attacked</button>
    <button class="buttons" type="button" id="levelup">Level Up</button>
</div>
</body>

</html>
